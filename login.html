<script>
    // فرم عضویت
    document.getElementById('signup-form').addEventListener('submit', function(e) {
        e.preventDefault(); // جلوگیری از رفرش صفحه

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const messageEl = document.getElementById('signup-message');

        // اعتبارسنجی ساده
        if (!email || !password) {
            messageEl.style.color = 'red';
            messageEl.textContent = 'لطفاً همه فیلدها را پر کنید!';
            return;
        }

        if (!email.includes('@') || !email.includes('.')) {
            messageEl.style.color = 'red';
            messageEl.textContent = 'ایمیل معتبر نیست!';
            return;
        }

        if (password.length < 4) {
            messageEl.style.color = 'red';
            messageEl.textContent = 'رمز عبور باید حداقل ۴ کاراکتر باشد!';
            return;
        }
		//ذخیره
        const user = { email, password, joinedAt: new Date().toLocaleString('fa-IR') };
        localStorage.setItem('noroUser', JSON.stringify(user));


        messageEl.style.color = 'green';
        messageEl.textContent = `خوش آمدی ${email.split('@')[0]}! ثبت نام موفق بود.`;

        // پاک کردن فرم
        this.reset();

        //  ریدایرکت به صفحه اصلی بعد از ۲ ثانیه
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
    });
</script>
